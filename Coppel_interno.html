<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Effective | Coppel</title>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
>

<style>

/* =========================================================
   GENERAL
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    font-family:"Inter",sans-serif;
    background:#ffffff;
    overflow:hidden;
}


/* =========================================================
   APP
========================================================= */

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
}


/* =========================================================
   HEADER
========================================================= */

.header{

    height:58px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 20px;

    background:#111111;

    border-bottom:1px solid #292929;

}


.brand{

    display:flex;
    align-items:center;

    gap:11px;

}


.logo{

    width:34px;
    height:34px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:8px;

    background:#d6ad54;

    color:#111;

    font-size:17px;
    font-weight:700;

}


.brand-text{
    display:flex;
    flex-direction:column;
}


.brand-title{

    color:#ffffff;

    font-size:15px;
    font-weight:600;

}


.brand-subtitle{

    margin-top:2px;

    color:#888;

    font-size:11px;

}


.header-right{

    display:flex;
    align-items:center;

    gap:7px;

    color:#aaa;

    font-size:11px;

}


.status-dot{

    width:7px;
    height:7px;

    border-radius:50%;

    background:#43c982;

}


/* =========================================================
   WORKSPACE
========================================================= */

.workspace{

    flex:1;

    display:flex;

    min-height:0;

}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{

    width:290px;

    flex-shrink:0;

    display:flex;
    flex-direction:column;

    background:#ffffff;

    border-right:1px solid #d8d8d8;

    transition:width .2s ease;

}


.sidebar.collapsed{

    width:52px;

}


/* =========================================================
   SIDEBAR HEADER
========================================================= */

.sidebar-header{

    height:50px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 14px 0 18px;

    border-bottom:1px solid #e7e7e7;

}


.sidebar-title{

    color:#222;

    font-size:14px;

    font-weight:600;

}


.sidebar.collapsed .sidebar-title{

    display:none;

}


.collapse-btn{

    width:28px;
    height:28px;

    border:0;

    display:flex;
    align-items:center;
    justify-content:center;

    background:transparent;

    color:#777;

    border-radius:5px;

    cursor:pointer;

}


.collapse-btn:hover{

    background:#eeeeee;

    color:#111;

}


/* =========================================================
   PAGINAS
========================================================= */

.pages{

    flex:1;

    overflow-y:auto;

    padding:6px 5px;

}


.page-btn{

    position:relative;

    width:100%;

    min-height:40px;

    display:flex;

    align-items:center;

    gap:9px;

    padding:8px 12px;

    border:0;

    background:#ffffff;

    color:#222;

    font-family:"Inter",sans-serif;

    font-size:12px;

    text-align:left;

    cursor:pointer;

    border-radius:2px;

    margin-bottom:1px;

    transition:background .12s ease;

}


.page-btn:hover{

    background:#f3f3f3;

}


.page-btn.active{

    background:#e9e9e9;

    font-weight:600;

}


.page-btn.active::before{

    content:"";

    position:absolute;

    left:3px;

    top:7px;

    bottom:7px;

    width:4px;

    border-radius:4px;

    background:#118c7e;

}


.page-btn i{

    width:17px;

    text-align:center;

    color:#777;

    flex-shrink:0;

}


.page-btn.active i{

    color:#118c7e;

}


.page-text{

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}


.sidebar.collapsed .page-text{

    display:none;

}


.sidebar.collapsed .page-btn{

    justify-content:center;

    padding-left:0;
    padding-right:0;

}


.sidebar.collapsed .page-btn.active::before{

    left:1px;

}


/* =========================================================
   SCROLL
========================================================= */

.pages::-webkit-scrollbar{

    width:5px;

}


.pages::-webkit-scrollbar-track{

    background:transparent;

}


.pages::-webkit-scrollbar-thumb{

    background:#cccccc;

    border-radius:10px;

}


/* =========================================================
   POWER BI
========================================================= */

.report-area{

    position:relative;

    flex:1;

    min-width:0;

    background:#ffffff;

}


.iframe-container{

    position:absolute;

    inset:0;

    background:#ffffff;

}


#powerbiFrame{

    width:100%;

    height:100%;

    display:block;

    border:0;

    background:#ffffff;

}


/* =========================================================
   LOADING
========================================================= */

.loading{

    position:absolute;

    inset:0;

    z-index:50;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#ffffff;

    color:#555;

    font-size:13px;

    transition:opacity .15s ease;

}


.loading.hidden{

    opacity:0;

    visibility:hidden;

    pointer-events:none;

}


.spinner{

    width:21px;
    height:21px;

    margin-right:10px;

    border:3px solid #dddddd;

    border-top-color:#118c7e;

    border-radius:50%;

    animation:spin .65s linear infinite;

}


@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =========================================================
   FULLSCREEN
========================================================= */

.fullscreen-btn{

    position:absolute;

    top:12px;
    right:16px;

    z-index:40;

    width:38px;
    height:38px;

    display:flex;

    align-items:center;
    justify-content:center;

    border:1px solid #dddddd;

    border-radius:6px;

    background:rgba(255,255,255,.95);

    color:#555;

    cursor:pointer;

    box-shadow:0 2px 8px rgba(0,0,0,.10);

}


.fullscreen-btn:hover{

    color:#111;

    background:#ffffff;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:800px){

    .sidebar{

        width:230px;

    }

}

</style>

</head>


<body>


<div class="app">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">


        <div class="brand">


            <div class="logo">

                E

            </div>


            <div class="brand-text">

                <span class="brand-title">

                    Effective

                </span>

                <span class="brand-subtitle">

                    Reporte de Competencia · Coppel

                </span>

            </div>


        </div>


        <div class="header-right">

            <span class="status-dot"></span>

            Power BI

        </div>


    </header>



    <!-- =====================================================
         WORKSPACE
    ====================================================== -->

    <div class="workspace">


        <!-- =================================================
             MENU
        ================================================== -->

        <aside
            class="sidebar"
            id="sidebar"
        >


            <div class="sidebar-header">


                <span class="sidebar-title">

                    Páginas

                </span>


                <button
                    class="collapse-btn"
                    id="collapseBtn"
                    title="Contraer páginas"
                >

                    <i class="fa-solid fa-angles-left"></i>

                </button>


            </div>



            <div
                class="pages"
                id="pages"
            ></div>


        </aside>



        <!-- =================================================
             POWER BI
        ================================================== -->

        <main
            class="report-area"
            id="reportArea"
        >


            <!-- LOADING -->

            <div
                class="loading"
                id="loading"
            >

                <div class="spinner"></div>

                Cargando reporte...

            </div>



            <!-- FULLSCREEN -->

            <button
                class="fullscreen-btn"
                id="fullscreenBtn"
                title="Pantalla completa"
            >

                <i class="fa-solid fa-expand"></i>

            </button>



            <!-- IFRAME -->

            <div class="iframe-container">


                <iframe
                    id="powerbiFrame"
                    title="Reporte Power BI"
                    allowfullscreen="true"
                ></iframe>


            </div>


        </main>


    </div>


</div>



<script>


/* ============================================================
   CONFIGURACION POWER BI
============================================================ */


const REPORT_ID =
    "7647a9ef-ef89-45fa-9689-2d64e55c5637";


const TENANT_ID =
    "1b635d23-d7cd-46f8-a33b-d081f11e0d7d";


const POWERBI_BASE_URL =

    "https://app.powerbi.com/reportEmbed" +

    "?reportId=" + REPORT_ID +

    "&autoAuth=true" +

    "&ctid=" + TENANT_ID +

    "&navContentPaneEnabled=false" +

    "&filterPaneEnabled=false";



/* ============================================================
   PAGINAS

   IDs REALES QUE ME PASASTE.

   ROW DATA NO ESTA INCLUIDO.
============================================================ */


const paginas = [


    /* ==============================
       REPORTES
    ============================== */

    {

        titulo:"Reportes",

        pageId:"0bd590e09ce705740dbb",

        icono:"fa-table-columns"

    },


    /* ==============================
       COPPEL PORTADA
    ============================== */

    {

        titulo:"Coppel PORTADA",

        pageId:"881bff93b9de002cba6a",

        icono:"fa-house"

    },


    /* ==============================
       GLOSARIO
    ============================== */

    {

        titulo:"Coppel GLOSARIO-TERMINOS",

        pageId:"0a85d6136e4d5605b004",

        icono:"fa-book"

    },


    /* ==============================
       EIC CONFIDENCIAL
    ============================== */

    {

        titulo:"Coppel EIC-CONFIDENCIAL",

        pageId:"8db29d4c626d4a60dbb6",

        icono:"fa-lock"

    },


    /* ==============================
       CONTENIDO
    ============================== */

    {

        titulo:"Coppel CONTENIDO",

        pageId:"e3167165bdb45881e1cd",

        icono:"fa-list"

    },


    /* ==============================
       SOI MARCA MEDIO
    ============================== */

    {

        titulo:"Coppel SOI marca-medio",

        pageId:"d7cff51812c40c095684",

        icono:"fa-chart-bar"

    },


    /* ==============================
       SOI IMPRESIONES
    ============================== */

    {

        titulo:"Coppel SOI marca-medio impresiones",

        pageId:"80f8296d8837b75ec863",

        icono:"fa-chart-column"

    },


    /* ==============================
       TIPO TIENDAS
    ============================== */

    {

        titulo:"Coppel SOI por tipo de tiendas YTD",

        pageId:"05b6a8037608c3395038",

        icono:"fa-store"

    },


    /* ==============================
       INVERSION
    ============================== */

    {

        titulo:"Coppel Inversión por Medio",

        pageId:"b004a9ed7cd4b9e00453",

        icono:"fa-dollar-sign"

    },


    /* ==============================
       TEMPORALIDAD
    ============================== */

    {

        titulo:"Coppel SOI por temporalidad YTD",

        pageId:"63ac364b5e80876e3764",

        icono:"fa-chart-line"

    },


    /* ==============================
       TV ABIERTA
    ============================== */

    {

        titulo:"Coppel Actividad Tv Abierta Nacional",

        pageId:"3476180640a1e911b741",

        icono:"fa-tv"

    },


    /* ==============================
       TV ABIERTA SOV / SOI
    ============================== */

    {

        titulo:"Coppel Tv abierta, SOV / SOI",

        pageId:"0fcdc9064c0be0be5026",

        icono:"fa-tv"

    },


    /* ==============================
       TV MES ACTUAL
    ============================== */

    {

        titulo:"Coppel Tv abierta SOV / SOI mes actual",

        pageId:"7dc1d0dccd8ee123d40d",

        icono:"fa-calendar"

    },


    /* ==============================
       TV LOCAL
    ============================== */

    {

        titulo:"Coppel Tv local",

        pageId:"883600c3ab088535b05d",

        icono:"fa-location-dot"

    },


    /* ==============================
       TV PAGA
    ============================== */

    {

        titulo:"Coppel Tv de Paga",

        pageId:"0b40b97a3d74da3dda03",

        icono:"fa-satellite-dish"

    },


    /* ==============================
       RADIO
    ============================== */

    {

        titulo:"Coppel Radio 49 Plazas",

        pageId:"033aca8780bdb0300b06",

        icono:"fa-radio"

    },


    /* ==============================
       RADIO FOOTPRINT
    ============================== */

    {

        titulo:"Coppel Radio Footprint",

        pageId:"de5aad3ea5869580840d",

        icono:"fa-tower-broadcast"

    },


    /* ==============================
       DIGITAL
    ============================== */

    {

        titulo:"Coppel DIGITAL",

        pageId:"4af16653c4d4bb0208",

        icono:"fa-globe"

    }


];



/* ============================================================
   ELEMENTOS
============================================================ */


const iframe =
    document.getElementById("powerbiFrame");


const pagesContainer =
    document.getElementById("pages");


const loading =
    document.getElementById("loading");


const sidebar =
    document.getElementById("sidebar");


const collapseBtn =
    document.getElementById("collapseBtn");


const fullscreenBtn =
    document.getElementById("fullscreenBtn");


const reportArea =
    document.getElementById("reportArea");



/* ============================================================
   CREAR MENU
============================================================ */


function crearMenu(){


    pagesContainer.innerHTML = "";


    paginas.forEach((pagina,index)=>{


        const boton =
            document.createElement("button");


        boton.className =
            "page-btn";


        boton.dataset.page =
            pagina.pageId;


        boton.title =
            pagina.titulo;


        boton.innerHTML = `

            <i class="fa-solid ${pagina.icono}"></i>

            <span class="page-text">

                ${pagina.titulo}

            </span>

        `;



        /* CLICK */


        boton.addEventListener(
            "click",
            function(){

                cambiarPagina(
                    pagina,
                    boton
                );

            }
        );



        /* PRIMERA ACTIVA */


        if(index === 0){

            boton.classList.add(
                "active"
            );

        }



        pagesContainer.appendChild(
            boton
        );


    });


}



/* ============================================================
   GENERAR URL DE PAGINA
============================================================ */


function generarURL(pageId){


    return (

        POWERBI_BASE_URL +

        "&pageName=" +

        encodeURIComponent(pageId)

    );


}



/* ============================================================
   CARGAR REPORTE INICIAL
============================================================ */


function cargarInicial(){


    if(paginas.length === 0){

        return;

    }


    loading.classList.remove(
        "hidden"
    );


    iframe.src =
        generarURL(
            paginas[0].pageId
        );


}



/* ============================================================
   CAMBIAR PAGINA
============================================================ */


function cambiarPagina(
    pagina,
    boton
){


    /* =====================================
       EVITAR CLICK EN LA MISMA PAGINA
    ===================================== */


    if(
        boton.classList.contains("active")
    ){

        return;

    }



    /* =====================================
       CAMBIAR BOTON ACTIVO
    ===================================== */


    document
        .querySelectorAll(".page-btn")
        .forEach(btn=>{

            btn.classList.remove(
                "active"
            );

        });


    boton.classList.add(
        "active"
    );



    /* =====================================
       MOSTRAR LOADING
    ===================================== */


    loading.classList.remove(
        "hidden"
    );



    /* =====================================
       CAMBIAR POWER BI
    ===================================== */


    const nuevaURL =
        generarURL(
            pagina.pageId
        );


    console.log(
        "Abriendo:",
        pagina.titulo,
        pagina.pageId
    );


    iframe.src =
        nuevaURL;


}



/* ============================================================
   CUANDO POWER BI CARGA
============================================================ */


iframe.addEventListener(
    "load",
    function(){


        /* Pequeño delay visual */

        setTimeout(
            function(){

                loading.classList.add(
                    "hidden"
                );

            },
            150
        );


    }
);



/* ============================================================
   CONTRAER MENU
============================================================ */


collapseBtn.addEventListener(
    "click",
    function(){


        sidebar.classList.toggle(
            "collapsed"
        );


        const icon =
            collapseBtn.querySelector("i");


        if(
            sidebar.classList.contains(
                "collapsed"
            )
        ){


            icon.className =
                "fa-solid fa-angles-right";


            collapseBtn.title =
                "Mostrar páginas";


        }

        else{


            icon.className =
                "fa-solid fa-angles-left";


            collapseBtn.title =
                "Contraer páginas";


        }


    }
);



/* ============================================================
   FULLSCREEN
============================================================ */


fullscreenBtn.addEventListener(
    "click",
    async function(){


        try{


            if(
                !document.fullscreenElement
            ){


                await reportArea
                    .requestFullscreen();


            }

            else{


                await document
                    .exitFullscreen();


            }


        }

        catch(error){


            console.error(
                "Error fullscreen:",
                error
            );


        }


    }
);



/* ============================================================
   ACTUALIZAR ICONO FULLSCREEN
============================================================ */


document.addEventListener(
    "fullscreenchange",
    function(){


        const icon =
            fullscreenBtn.querySelector("i");


        if(
            document.fullscreenElement
        ){


            icon.className =
                "fa-solid fa-compress";


        }

        else{


            icon.className =
                "fa-solid fa-expand";


        }


    }
);



/* ============================================================
   INICIAR
============================================================ */


crearMenu();

cargarInicial();


</script>


</body>

</html>
