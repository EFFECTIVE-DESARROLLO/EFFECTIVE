
<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Effective | Coppel</title>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>

<style>

/* GENERAL */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
}

body {
    font-family: "Inter", sans-serif;
    background: #ffffff;
    overflow: hidden;
}

/* APP */

.app {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
}

/* HEADER */

.header {
    height: 58px;
    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 20px;

    background: #111111;
    border-bottom: 1px solid #292929;
}

.brand {
    display: flex;
    align-items: center;
    gap: 11px;
}

.logo {
    width: 34px;
    height: 34px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 8px;

    background: #d6ad54;
    color: #111111;

    font-size: 17px;
    font-weight: 700;
}

.brand-text {
    display: flex;
    flex-direction: column;
}

.brand-title {
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
}

.brand-subtitle {
    margin-top: 2px;
    color: #888888;
    font-size: 11px;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 7px;

    color: #aaaaaa;
    font-size: 11px;
}

.status-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;
    background: #43c982;
}

/* WORKSPACE */

.workspace {
    flex: 1;
    display: flex;
    min-height: 0;
    width: 100%;
}

/* POWER BI */

.report-area {
    position: relative;
    flex: 1;
    width: 100%;
    min-width: 0;
    background: #ffffff;
}

.iframe-container {
    position: absolute;
    inset: 0;
    background: #ffffff;
}

#powerbiFrame {
    width: 100%;
    height: 100%;
    display: block;
    border: 0;
    background: #ffffff;
}

/* LOADING */

.loading {
    position: absolute;
    inset: 0;
    z-index: 50;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #ffffff;
    color: #555555;
    font-size: 13px;

    transition: opacity .15s ease;
}

.loading.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.spinner {
    width: 21px;
    height: 21px;

    margin-right: 10px;

    border: 3px solid #dddddd;
    border-top-color: #118c7e;

    border-radius: 50%;

    animation: spin .65s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <div class="brand">

            <div class="logo">E</div>

            <div class="brand-text">

                <span class="brand-title">
                    Effective
                </span>

                <span class="brand-subtitle">
                    Reporte de Competencia · Coppel
                </span>

            </div>

        </div>

        <div class="header-right">

            <span class="status-dot"></span>

            Power BI

        </div>

    </header>

    <!-- WORKSPACE -->

    <div class="workspace">

        <main class="report-area" id="reportArea">

            <!-- LOADING -->

            <div class="loading" id="loading">

                <div class="spinner"></div>

                Cargando reporte...

            </div>

            <!-- POWER BI -->

            <div class="iframe-container">

                <iframe
                    id="powerbiFrame"
                    title="Reporte Power BI"
                    allowfullscreen
                ></iframe>

            </div>

        </main>

    </div>

</div>

<script>

/* CONFIGURACION POWER BI */

const REPORT_ID =
    "7647a9ef-ef89-45fa-9689-2d64e55c5637";

const TENANT_ID =
    "1b635d23-d7cd-46f8-a33b-d081f11e0d7d";

/* PAGINA INICIAL */

const PAGE_ID =
    "881bff93b9de002cba6a";

/* ELEMENTOS */

const iframe =
    document.getElementById("powerbiFrame");

const loading =
    document.getElementById("loading");

/* GENERAR URL */

function generarURL() {

    const url = new URL(
        "https://app.powerbi.com/reportEmbed"
    );

    url.searchParams.set("reportId", REPORT_ID);
    url.searchParams.set("autoAuth", "true");
    url.searchParams.set("ctid", TENANT_ID);
    url.searchParams.set("navContentPaneEnabled", "false");
    url.searchParams.set("filterPaneEnabled", "false");
    url.searchParams.set("pageName", PAGE_ID);

    return url.toString();
}

/* CARGAR REPORTE */

function cargarReporte() {

    loading.classList.remove("hidden");

    iframe.src = generarURL();

}

/* TERMINAR CARGA */

iframe.addEventListener("load", function() {

    setTimeout(function() {

        loading.classList.add("hidden");

    }, 150);

});

/* INICIAR */

cargarReporte();

</script>

</body>
</html>
