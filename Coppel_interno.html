<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Effective | Coppel</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- POWER BI SDK -->
<script src="https://cdn.jsdelivr.net/npm/powerbi-client@2.23.1/dist/powerbi.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    font-family:Inter,sans-serif;
    background:#fff;
    overflow:hidden;
}

.app{
    width:100%;
    height:100vh;
    display:flex;
}


/* =========================================
   MENU IZQUIERDO
========================================= */

.sidebar{
    width:270px;
    height:100%;
    background:#fff;
    border-right:1px solid #ddd;
    display:flex;
    flex-direction:column;
    flex-shrink:0;
    transition:width .2s ease;
}

.sidebar.collapsed{
    width:55px;
}


/* CABECERA */

.sidebar-header{
    height:62px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    border-bottom:1px solid #eee;
}

.sidebar-title{
    font-size:18px;
    font-weight:600;
    color:#222;
}

.sidebar.collapsed .sidebar-title{
    display:none;
}

.collapse{
    border:0;
    background:transparent;
    cursor:pointer;
    color:#777;
    font-size:16px;
}

.collapse:hover{
    color:#008272;
}


/* =========================================
   PAGINAS
========================================= */

.pages{
    flex:1;
    overflow-y:auto;
    padding:8px 7px;
}

.page{
    width:100%;
    min-height:40px;

    border:0;
    background:#fff;

    display:flex;
    align-items:center;
    gap:10px;

    padding:9px 11px;

    cursor:pointer;

    font-family:Inter,sans-serif;
    font-size:13px;

    color:#222;

    text-align:left;

    border-radius:2px;

    margin-bottom:2px;

    position:relative;
}

.page:hover{
    background:#f3f3f3;
}

.page.active{
    background:#e9e9e9;
    font-weight:600;
}

.page.active::before{
    content:"";
    position:absolute;

    left:0;
    top:7px;
    bottom:7px;

    width:4px;

    border-radius:3px;

    background:#008272;
}

.page i{
    width:18px;
    text-align:center;
    color:#777;
}

.page.active i{
    color:#008272;
}

.sidebar.collapsed .page span{
    display:none;
}

.sidebar.collapsed .page{
    justify-content:center;
    padding:10px 0;
}


/* SCROLL */

.pages::-webkit-scrollbar{
    width:6px;
}

.pages::-webkit-scrollbar-thumb{
    background:#ccc;
    border-radius:10px;
}


/* =========================================
   POWER BI
========================================= */

.report-area{
    flex:1;
    height:100%;
    min-width:0;
    position:relative;
    background:#f5f5f5;
}

#reportContainer{
    width:100%;
    height:100%;
}


/* =========================================
   CARGANDO
========================================= */

.loading{
    position:absolute;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#fff;

    z-index:20;

    font-size:14px;
    color:#555;
}

.loading.hidden{
    display:none;
}

.spinner{
    width:22px;
    height:22px;

    border:3px solid #ddd;
    border-top-color:#008272;

    border-radius:50%;

    animation:spin .7s linear infinite;

    margin-right:10px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}


/* =========================================
   FULLSCREEN
========================================= */

.fullscreen{
    position:absolute;

    right:18px;
    top:15px;

    z-index:10;

    width:38px;
    height:38px;

    border:1px solid #ddd;
    border-radius:6px;

    background:#fff;

    color:#555;

    cursor:pointer;

    box-shadow:0 2px 7px rgba(0,0,0,.1);
}

.fullscreen:hover{
    color:#008272;
}

</style>
</head>


<body>

<div class="app">


    <!-- =====================================
         MENU
    ====================================== -->

    <aside class="sidebar" id="sidebar">

        <div class="sidebar-header">

            <div class="sidebar-title">
                Páginas
            </div>

            <button
                class="collapse"
                id="collapseBtn"
            >
                <i class="fa-solid fa-angles-left"></i>
            </button>

        </div>


        <div class="pages" id="pages">

        </div>

    </aside>



    <!-- =====================================
         POWER BI
    ====================================== -->

    <main class="report-area" id="reportArea">


        <div class="loading" id="loading">

            <div class="spinner"></div>

            Cargando reporte...

        </div>


        <button
            class="fullscreen"
            id="fullscreenBtn"
        >
            <i class="fa-solid fa-expand"></i>
        </button>


        <div id="reportContainer"></div>


    </main>


</div>


<script>

/* ============================================================
   CONFIGURACION POWER BI
============================================================ */

const models = window["powerbi-client"].models;


/* TU REPORTE */

const config = {

    type: "report",

    id: "7647a9ef-ef89-45fa-9689-2d64e55c5637",

    embedUrl:
        "https://app.powerbi.com/reportEmbed" +
        "?reportId=7647a9ef-ef89-45fa-9689-2d64e55c5637" +
        "&autoAuth=true" +
        "&ctid=1b635d23-d7cd-46f8-a33b-d081f11e0d7d",

    tokenType: models.TokenType.Aad,

    permissions: models.Permissions.Read,

    settings: {

        panes: {

            filters: {
                visible: false
            },

            pageNavigation: {
                visible: false
            }

        },

        bars: {

            statusBar: {
                visible: false
            }

        }

    }

};


/* ============================================================
   PAGINAS QUE QUIERES MOSTRAR

   IMPORTANTE:
   El titulo puede ser exactamente el nombre visible.

   El código buscará automáticamente las páginas reales
   del reporte por displayName.

   YA NO NECESITAS ESCRIBIR REPORTSECTION A MANO.
============================================================ */


const paginasPermitidas = [

    "Coppel PORTADA",

    "Coppel CONTENIDO",

    "Coppel SOI marca-medio",

    "Coppel SOI marca-medio impresiones",

    "Coppel SOI por tipo de tiendas YTD",

    "Coppel Inversión por Medio",

    "Coppel SOI por temporalidad YTD",

    "Coppel Actividad Tv Abierta Nacional",

    "Coppel Tv abierta, SOV / SOI",

    "Coppel Tv abierta SOV / SOI mes actual",

    "Coppel Tv local",

    "Coppel Tv de Paga",

    "Coppel Radio 49 Plazas",

    "Coppel Radio Footprint",

    "Coppel DIGITAL"

];


/* ============================================================
   ELEMENTOS
============================================================ */

const container =
    document.getElementById("reportContainer");

const pagesContainer =
    document.getElementById("pages");

const loading =
    document.getElementById("loading");

const sidebar =
    document.getElementById("sidebar");

const collapseBtn =
    document.getElementById("collapseBtn");

const fullscreenBtn =
    document.getElementById("fullscreenBtn");

const reportArea =
    document.getElementById("reportArea");


/* ============================================================
   CARGAR POWER BI UNA SOLA VEZ
============================================================ */

powerbi.reset(container);

const report =
    powerbi.embed(container, config);


/* ============================================================
   CUANDO POWER BI TERMINE DE CARGAR
============================================================ */

report.on("loaded", async function(){

    console.log("Power BI cargado");

    try{

        await crearMenu();

        loading.classList.add("hidden");

    }

    catch(error){

        console.error(
            "Error obteniendo páginas:",
            error
        );

        loading.innerHTML =
            "No se pudieron cargar las páginas.";

    }

});


/* ============================================================
   ERRORES POWER BI
============================================================ */

report.on("error", function(event){

    console.error(
        "Power BI error:",
        event.detail
    );

});


/* ============================================================
   CREAR MENU

   Power BI nos devuelve TODAS sus páginas.

   Nosotros filtramos únicamente las autorizadas.
============================================================ */

async function crearMenu(){

    const paginasPowerBI =
        await report.getPages();


    console.log(
        "Páginas Power BI:",
        paginasPowerBI
    );


    pagesContainer.innerHTML = "";


    /* RECORRER SOLO LAS PERMITIDAS */

    paginasPermitidas.forEach(nombrePermitido => {


        const paginaReal =
            paginasPowerBI.find(p =>

                p.displayName
                    .trim()
                    .toLowerCase()

                ===

                nombrePermitido
                    .trim()
                    .toLowerCase()

            );


        /* SI NO EXISTE */

        if(!paginaReal){

            console.warn(
                "Página no encontrada:",
                nombrePermitido
            );

            return;

        }


        /* CREAR BOTON */

        const button =
            document.createElement("button");


        button.className = "page";


        button.dataset.page =
            paginaReal.name;


        button.innerHTML = `

            <i class="fa-regular fa-file"></i>

            <span>
                ${paginaReal.displayName}
            </span>

        `;


        /* CLICK */

        button.addEventListener(
            "click",
            async function(){

                await cambiarPagina(
                    paginaReal,
                    button
                );

            }
        );


        pagesContainer.appendChild(button);


        /* MARCAR ACTIVA */

        if(paginaReal.isActive){

            button.classList.add("active");

        }


    });

}


/* ============================================================
   CAMBIAR PAGINA

   ESTA ES LA PARTE IMPORTANTE.

   NO RECARGAMOS POWER BI.

   setActive() cambia directamente de slide.
============================================================ */

async function cambiarPagina(
    pagina,
    boton
){

    try{


        /* Cambiar página */

        await pagina.setActive();


        /* quitar activo */

        document
            .querySelectorAll(".page")
            .forEach(btn => {

                btn.classList.remove("active");

            });


        /* nuevo activo */

        boton.classList.add("active");


    }

    catch(error){

        console.error(
            "Error cambiando página:",
            error
        );

    }

}


/* ============================================================
   SI POWER BI CAMBIA PAGINA INTERNAMENTE
============================================================ */

report.on(
    "pageChanged",
    function(event){

        const pagina =
            event.detail.newPage;


        document
            .querySelectorAll(".page")
            .forEach(btn => {


                btn.classList.toggle(

                    "active",

                    btn.dataset.page === pagina.name

                );


            });

    }
);


/* ============================================================
   CONTRAER MENU
============================================================ */

collapseBtn.addEventListener(
    "click",
    function(){

        sidebar.classList.toggle(
            "collapsed"
        );


        const icon =
            collapseBtn.querySelector("i");


        if(
            sidebar.classList.contains(
                "collapsed"
            )
        ){

            icon.className =
                "fa-solid fa-angles-right";

        }

        else{

            icon.className =
                "fa-solid fa-angles-left";

        }

    }
);


/* ============================================================
   FULLSCREEN
============================================================ */

fullscreenBtn.addEventListener(
    "click",
    async function(){

        try{

            if(!document.fullscreenElement){

                await reportArea.requestFullscreen();

            }

            else{

                await document.exitFullscreen();

            }

        }

        catch(error){

            console.error(
                "Fullscreen:",
                error
            );

        }

    }
);


</script>

</body>
</html>
