<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Effective | Reporte Coppel</title>


  <!-- ICONOS -->

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >


  <!-- FUENTE -->

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >


  <style>

    :root {

      --gold: #d4a843;

      --gold-light: #f0d078;

      --dark: #0a0a0a;

      --dark2: #101010;

      --dark3: #171717;

      --text: #ffffff;

      --muted: rgba(255,255,255,.55);

      --border: rgba(255,255,255,.08);

    }


    * {

      margin: 0;

      padding: 0;

      box-sizing: border-box;

    }


    html,
    body {

      width: 100%;

      height: 100%;

    }


    body {

      background: var(--dark);

      color: white;

      font-family: "Inter", sans-serif;

      overflow: hidden;

    }



    /* =====================================================
       APP
    ===================================================== */


    .app {

      width: 100%;

      height: 100vh;

      display: flex;

      flex-direction: column;

      background: #090909;

    }



    /* =====================================================
       HEADER
    ===================================================== */


    .topbar {

      height: 68px;

      flex-shrink: 0;

      background: #101010;

      border-bottom: 1px solid var(--border);

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 0 24px;

    }


    .brand {

      display: flex;

      align-items: center;

      gap: 13px;

    }


    .brand-icon {

      width: 40px;

      height: 40px;

      border-radius: 11px;

      display: grid;

      place-items: center;

      font-weight: 900;

      color: #000;

      background:

        linear-gradient(
          135deg,
          var(--gold),
          var(--gold-light)
        );

    }


    .brand-info {

      display: flex;

      flex-direction: column;

    }


    .brand-name {

      color: var(--gold);

      font-size: 19px;

      font-weight: 800;

    }


    .brand-subtitle {

      color: var(--muted);

      font-size: 11px;

      margin-top: 2px;

    }



    .topbar-right {

      display: flex;

      align-items: center;

      gap: 12px;

    }


    .status {

      display: flex;

      align-items: center;

      gap: 7px;

      color: var(--muted);

      font-size: 12px;

    }


    .status-dot {

      width: 8px;

      height: 8px;

      background: #35d07f;

      border-radius: 50%;

    }



    /* =====================================================
       WORKSPACE
    ===================================================== */


    .workspace {

      flex: 1;

      min-height: 0;

      display: flex;

    }



    /* =====================================================
       MENU LATERAL
    ===================================================== */


    .sidebar {

      width: 300px;

      flex-shrink: 0;

      background: #101010;

      border-right: 1px solid var(--border);

      display: flex;

      flex-direction: column;

      transition: width .3s ease;

    }


    .sidebar.collapsed {

      width: 64px;

    }



    /* HEADER MENU */


    .sidebar-header {

      height: 62px;

      padding: 0 18px;

      border-bottom: 1px solid var(--border);

      display: flex;

      align-items: center;

      justify-content: space-between;

    }


    .sidebar-title {

      font-size: 17px;

      font-weight: 700;

      white-space: nowrap;

    }


    .sidebar.collapsed .sidebar-title {

      display: none;

    }


    .collapse-btn {

      width: 32px;

      height: 32px;

      border: none;

      border-radius: 8px;

      background: transparent;

      color: var(--gold);

      cursor: pointer;

      display: grid;

      place-items: center;

    }


    .collapse-btn:hover {

      background: rgba(212,168,67,.12);

    }



    /* =====================================================
       LISTA PAGINAS
    ===================================================== */


    .pages-list {

      flex: 1;

      overflow-y: auto;

      padding: 10px;

    }


    .page-btn {

      width: 100%;

      min-height: 45px;

      border: none;

      border-radius: 9px;

      background: transparent;

      color: rgba(255,255,255,.78);

      font-family: inherit;

      cursor: pointer;

      display: flex;

      align-items: center;

      gap: 12px;

      text-align: left;

      padding: 10px 13px;

      margin-bottom: 4px;

      transition: all .2s ease;

      position: relative;

    }


    .page-btn:hover {

      color: white;

      background: rgba(212,168,67,.08);

    }


    .page-btn.active {

      color: white;

      background:

        linear-gradient(
          90deg,
          rgba(212,168,67,.18),
          rgba(212,168,67,.04)
        );

    }


    .page-btn.active::before {

      content: "";

      width: 3px;

      border-radius: 10px;

      background: var(--gold);

      position: absolute;

      left: 0;

      top: 8px;

      bottom: 8px;

    }


    .page-btn i {

      width: 20px;

      flex-shrink: 0;

      text-align: center;

      color: rgba(255,255,255,.38);

    }


    .page-btn.active i,
    .page-btn:hover i {

      color: var(--gold);

    }


    .page-label {

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

      font-size: 13px;

    }


    .sidebar.collapsed .page-label {

      display: none;

    }


    .sidebar.collapsed .page-btn {

      justify-content: center;

      padding-left: 0;

      padding-right: 0;

    }



    /* SCROLL */


    .pages-list::-webkit-scrollbar {

      width: 5px;

    }


    .pages-list::-webkit-scrollbar-track {

      background: transparent;

    }


    .pages-list::-webkit-scrollbar-thumb {

      background: rgba(255,255,255,.16);

      border-radius: 10px;

    }



    /* =====================================================
       REPORTE
    ===================================================== */


    .report-container {

      flex: 1;

      min-width: 0;

      position: relative;

      background: #070707;

    }


    #dashboardFrame {

      position: absolute;

      inset: 0;

      width: 100%;

      height: 100%;

      border: none;

      background: white;

    }



    /* =====================================================
       PANTALLA COMPLETA
    ===================================================== */


    .fullscreen-btn {

      position: absolute;

      right: 17px;

      top: 15px;

      z-index: 30;

      width: 40px;

      height: 40px;

      border: 1px solid rgba(255,255,255,.14);

      border-radius: 10px;

      background: rgba(10,10,10,.82);

      color: white;

      cursor: pointer;

      display: grid;

      place-items: center;

      backdrop-filter: blur(8px);

    }


    .fullscreen-btn:hover {

      color: var(--gold);

      border-color: rgba(212,168,67,.45);

    }



    /* =====================================================
       RESPONSIVE
    ===================================================== */


    @media(max-width:900px) {

      .sidebar {

        width: 240px;

      }

    }


  </style>

</head>



<body>


<div class="app">


  <!-- =====================================================
       HEADER
  ====================================================== -->


  <header class="topbar">


    <div class="brand">


      <div class="brand-icon">

        E

      </div>


      <div class="brand-info">

        <span class="brand-name">

          Effective

        </span>

        <span class="brand-subtitle">

          Reporte de Competencia Retail · Coppel

        </span>

      </div>


    </div>



    <div class="topbar-right">


      <div class="status">

        <span class="status-dot"></span>

        Power BI conectado

      </div>


    </div>


  </header>



  <!-- =====================================================
       AREA PRINCIPAL
  ====================================================== -->


  <div class="workspace">



    <!-- =====================================================
         MENU PAGINAS
    ====================================================== -->


    <aside
      class="sidebar"
      id="sidebar"
    >


      <div class="sidebar-header">


        <span class="sidebar-title">

          Páginas

        </span>


        <button
          class="collapse-btn"
          id="collapseBtn"
          title="Contraer menú"
        >

          <i class="fas fa-angles-left"></i>

        </button>


      </div>



      <div
        class="pages-list"
        id="pagesList"
      >

      </div>


    </aside>



    <!-- =====================================================
         POWER BI
    ====================================================== -->


    <main
      class="report-container"
      id="reportContainer"
    >


      <button
        class="fullscreen-btn"
        id="fullscreenBtn"
        title="Pantalla completa"
      >

        <i class="fas fa-expand"></i>

      </button>


      <iframe
        id="dashboardFrame"
        title="Reporte Power BI Coppel"
        allowfullscreen="true"
      >

      </iframe>


    </main>


  </div>


</div>



<script>


/* ==========================================================
   URL POWER BI
========================================================== */


const POWERBI_BASE_URL =

"https://app.powerbi.com/reportEmbed?reportId=7647a9ef-ef89-45fa-9689-2d64e55c5637&autoAuth=true&ctid=1b635d23-d7cd-46f8-a33b-d081f11e0d7d&navContentPaneEnabled=false&filterPaneEnabled=false";



/* ==========================================================
   PAGINAS QUE EL USUARIO PODRA VER

   SOLO ESTAS APARECERAN EN EL MENU.

   IMPORTANTE:
   Cambia cada ReportSectionXXXX
   por el Page Name verdadero de Power BI.
========================================================== */


const paginasPermitidas = [


  {

    titulo: "Coppel PORTADA",

    pageName: "ReportSection_PORTADA",

    icono: "fa-house"

  },


  {

    titulo: "Coppel CONTENIDO",

    pageName: "ReportSection_CONTENIDO",

    icono: "fa-list"

  },


  {

    titulo: "Coppel SOI marca-medio",

    pageName: "ReportSection_SOI_MARCA_MEDIO",

    icono: "fa-chart-bar"

  },


  {

    titulo: "Coppel SOI marca-medio impresiones",

    pageName: "ReportSection_SOI_IMPRESIONES",

    icono: "fa-chart-column"

  },


  {

    titulo: "Coppel SOI por tipo de tiendas YTD",

    pageName: "ReportSection_SOI_TIPO_TIENDAS",

    icono: "fa-chart-pie"

  },


  {

    titulo: "Coppel Inversión por Medio",

    pageName: "ReportSection_INVERSION_MEDIO",

    icono: "fa-dollar-sign"

  },


  {

    titulo: "Coppel SOI por temporalidad YTD",

    pageName: "ReportSection_SOI_TEMPORALIDAD",

    icono: "fa-chart-line"

  },


  {

    titulo: "Coppel Actividad Tv Abierta Nacional",

    pageName: "ReportSection_ACTIVIDAD_TV",

    icono: "fa-tv"

  },


  {

    titulo: "Coppel Tv abierta, SOV / SOI",

    pageName: "ReportSection_TV_SOV_SOI",

    icono: "fa-tv"

  },


  {

    titulo: "Coppel Tv abierta SOV / SOI mes actual",

    pageName: "ReportSection_TV_SOV_SOI_MES",

    icono: "fa-calendar"

  },


  {

    titulo: "Coppel Tv local",

    pageName: "ReportSection_TV_LOCAL",

    icono: "fa-location-dot"

  },


  {

    titulo: "Coppel Tv de Paga",

    pageName: "ReportSection_TV_PAGA",

    icono: "fa-satellite-dish"

  },


  {

    titulo: "Coppel Radio 49 Plazas",

    pageName: "ReportSection_RADIO_49",

    icono: "fa-radio"

  },


  {

    titulo: "Coppel Radio Footprint",

    pageName: "ReportSection_RADIO_FOOTPRINT",

    icono: "fa-tower-broadcast"

  },


  {

    titulo: "Coppel DIGITAL",

    pageName: "ReportSection_DIGITAL",

    icono: "fa-globe"

  }


];



/* ==========================================================
   ELEMENTOS
========================================================== */


const iframe =

document.getElementById("dashboardFrame");


const pagesList =

document.getElementById("pagesList");


const sidebar =

document.getElementById("sidebar");


const collapseBtn =

document.getElementById("collapseBtn");


const fullscreenBtn =

document.getElementById("fullscreenBtn");


const reportContainer =

document.getElementById("reportContainer");



/* ==========================================================
   CREAR MENU
========================================================== */


function crearMenu() {


  pagesList.innerHTML = "";


  paginasPermitidas.forEach(

    (pagina, index) => {


      const boton =

      document.createElement("button");


      boton.className = "page-btn";


      boton.title = pagina.titulo;


      boton.innerHTML = `

        <i class="fas ${pagina.icono}"></i>

        <span class="page-label">

          ${pagina.titulo}

        </span>

      `;


      boton.addEventListener(

        "click",

        () => {


          abrirPagina(

            pagina.pageName,

            boton

          );


        }

      );


      pagesList.appendChild(boton);



      /* ==========================================
         PRIMERA PAGINA
      ========================================== */


      if(index === 0) {


        abrirPagina(

          pagina.pageName,

          boton

        );


      }


    }

  );


}



/* ==========================================================
   CAMBIAR PAGINA POWER BI
========================================================== */


function abrirPagina(

  pageName,

  boton

) {


  /* Quitar página activa anterior */


  document

    .querySelectorAll(".page-btn")

    .forEach(

      elemento =>

      elemento.classList.remove("active")

    );



  /* Activar nueva */


  if(boton) {


    boton.classList.add("active");


  }



  /* Cambiar Power BI */


  const nuevaURL =

    POWERBI_BASE_URL

    +

    "&pageName="

    +

    encodeURIComponent(pageName);



  iframe.src = nuevaURL;


}



/* ==========================================================
   CONTRAER MENU
========================================================== */


collapseBtn.addEventListener(

  "click",

  () => {


    sidebar.classList.toggle("collapsed");


    const icono =

    collapseBtn.querySelector("i");



    if(

      sidebar.classList.contains("collapsed")

    ) {


      icono.className =

      "fas fa-angles-right";


    }

    else {


      icono.className =

      "fas fa-angles-left";


    }


  }

);



/* ==========================================================
   PANTALLA COMPLETA
========================================================== */


fullscreenBtn.addEventListener(

  "click",

  async () => {


    try {


      if(

        !document.fullscreenElement

      ) {


        await reportContainer.requestFullscreen();


      }

      else {


        await document.exitFullscreen();


      }


    }

    catch(error) {


      console.error(

        "Error pantalla completa:",

        error

      );


    }


  }

);



/* ==========================================================
   INICIAR
========================================================== */


crearMenu();


</script>


</body>

</html>
