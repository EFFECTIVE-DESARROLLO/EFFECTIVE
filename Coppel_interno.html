<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Effective | Dashboard Coppel</title>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
>

<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
  rel="stylesheet"
>

<style>

:root{
    --gold:#d4a843;
    --gold-light:#f0d078;
    --dark:#0a0a0a;
    --dark2:#101010;
    --border:rgba(255,255,255,.08);
    --text:#ffffff;
    --muted:rgba(255,255,255,.55);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    font-family:"Inter",sans-serif;
    background:var(--dark);
    overflow:hidden;
}


/* =========================================
   APP
========================================= */

.app{
    height:100vh;
    display:flex;
    flex-direction:column;
}


/* =========================================
   HEADER
========================================= */

.topbar{

    height:64px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 24px;

    background:#0e0e0e;

    border-bottom:1px solid var(--border);

}


.brand{
    display:flex;
    align-items:center;
    gap:12px;
}


.logo{

    width:38px;
    height:38px;

    display:grid;
    place-items:center;

    border-radius:10px;

    background:
        linear-gradient(
            135deg,
            var(--gold),
            var(--gold-light)
        );

    color:#000;

    font-weight:800;

}


.brand-info{
    display:flex;
    flex-direction:column;
}


.brand-name{
    color:var(--gold);
    font-size:18px;
    font-weight:800;
}


.brand-sub{
    margin-top:2px;
    color:var(--muted);
    font-size:11px;
}


.status{

    display:flex;
    align-items:center;
    gap:7px;

    color:var(--muted);

    font-size:12px;

}


.status-dot{

    width:8px;
    height:8px;

    border-radius:50%;

    background:#3ddc84;

}


/* =========================================
   WORKSPACE
========================================= */

.workspace{

    flex:1;

    display:flex;

    min-height:0;

}


/* =========================================
   SIDEBAR
========================================= */

.sidebar{

    width:285px;

    flex-shrink:0;

    background:#111;

    border-right:1px solid var(--border);

    display:flex;

    flex-direction:column;

    transition:width .2s ease;

}


.sidebar.collapsed{
    width:58px;
}


/* HEADER SIDEBAR */

.sidebar-header{

    height:58px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 16px;

    border-bottom:1px solid var(--border);

}


.sidebar-title{

    color:white;

    font-size:15px;

    font-weight:600;

}


.sidebar.collapsed .sidebar-title{
    display:none;
}


.collapse-btn{

    width:30px;
    height:30px;

    display:grid;
    place-items:center;

    border:0;

    border-radius:7px;

    background:transparent;

    color:#aaa;

    cursor:pointer;

}


.collapse-btn:hover{

    background:rgba(212,168,67,.12);

    color:var(--gold);

}


/* =========================================
   PAGINAS
========================================= */

.pages{

    flex:1;

    overflow-y:auto;

    padding:8px;

}


.page-btn{

    width:100%;

    min-height:42px;

    padding:9px 11px;

    margin-bottom:3px;

    display:flex;

    align-items:center;

    gap:11px;

    border:0;

    border-radius:7px;

    background:transparent;

    color:rgba(255,255,255,.72);

    font-family:inherit;

    font-size:12px;

    text-align:left;

    cursor:pointer;

    position:relative;

    transition:
        background .15s,
        color .15s;

}


.page-btn:hover{

    background:rgba(255,255,255,.06);

    color:#fff;

}


.page-btn.active{

    background:
        linear-gradient(
            90deg,
            rgba(212,168,67,.18),
            rgba(212,168,67,.04)
        );

    color:#fff;

}


.page-btn.active::before{

    content:"";

    position:absolute;

    left:0;

    top:7px;

    bottom:7px;

    width:3px;

    border-radius:4px;

    background:var(--gold);

}


.page-btn i{

    width:19px;

    flex-shrink:0;

    text-align:center;

    color:rgba(255,255,255,.35);

}


.page-btn.active i,
.page-btn:hover i{

    color:var(--gold);

}


.page-text{

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}


.sidebar.collapsed .page-text{
    display:none;
}


.sidebar.collapsed .page-btn{

    justify-content:center;

    padding-left:0;

    padding-right:0;

}


/* SCROLL */

.pages::-webkit-scrollbar{
    width:5px;
}


.pages::-webkit-scrollbar-thumb{

    background:rgba(255,255,255,.15);

    border-radius:10px;

}


/* =========================================
   POWER BI
========================================= */

.report-area{

    flex:1;

    min-width:0;

    position:relative;

    background:#fff;

}


.iframe-wrap{

    position:absolute;

    inset:0;

    overflow:hidden;

    background:white;

}


#dashboardFrame{

    width:100%;

    height:100%;

    border:0;

    display:block;

    background:#fff;

}


/* =========================================
   LOADING
========================================= */

.loading{

    position:absolute;

    inset:0;

    z-index:20;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#fff;

    color:#555;

    font-size:13px;

    transition:opacity .2s;

}


.loading.hidden{

    opacity:0;

    pointer-events:none;

}


.spinner{

    width:21px;
    height:21px;

    margin-right:10px;

    border:3px solid #ddd;

    border-top-color:var(--gold);

    border-radius:50%;

    animation:spin .65s linear infinite;

}


@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =========================================
   FULLSCREEN
========================================= */

.fullscreen-btn{

    position:absolute;

    top:14px;

    right:17px;

    z-index:15;

    width:38px;

    height:38px;

    display:grid;

    place-items:center;

    border:1px solid #ddd;

    border-radius:7px;

    background:rgba(255,255,255,.95);

    color:#555;

    cursor:pointer;

    box-shadow:0 2px 8px rgba(0,0,0,.12);

}


.fullscreen-btn:hover{
    color:#000;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:800px){

    .sidebar{
        width:220px;
    }

}

</style>

</head>


<body>


<div class="app">


<!-- =========================================
     HEADER
========================================= -->

<header class="topbar">

    <div class="brand">

        <div class="logo">
            E
        </div>

        <div class="brand-info">

            <span class="brand-name">
                Effective
            </span>

            <span class="brand-sub">
                Reporte de Competencia Retail · Coppel
            </span>

        </div>

    </div>


    <div class="status">

        <span class="status-dot"></span>

        En vivo

    </div>

</header>



<!-- =========================================
     CONTENIDO
========================================= -->

<div class="workspace">


<!-- =========================================
     MENU
========================================= -->

<aside
    class="sidebar"
    id="sidebar"
>

    <div class="sidebar-header">

        <span class="sidebar-title">
            Páginas
        </span>

        <button
            class="collapse-btn"
            id="collapseBtn"
            title="Contraer menú"
        >

            <i class="fa-solid fa-angles-left"></i>

        </button>

    </div>


    <div
        class="pages"
        id="pages"
    >
    </div>


</aside>



<!-- =========================================
     POWER BI
========================================= -->

<main
    class="report-area"
    id="reportArea"
>


    <div
        class="loading"
        id="loading"
    >

        <div class="spinner"></div>

        Cargando dashboard...

    </div>


    <button
        class="fullscreen-btn"
        id="fullscreenBtn"
        title="Pantalla completa"
    >

        <i class="fa-solid fa-expand"></i>

    </button>


    <div class="iframe-wrap">

        <iframe
            id="dashboardFrame"
            title="Dashboard Coppel"
            allowfullscreen="true"
        >
        </iframe>

    </div>


</main>


</div>

</div>



<script>


/* ============================================================
   POWER BI

   ESTA ES TU URL ACTUAL
============================================================ */


const POWERBI_URL =

    "https://app.powerbi.com/reportEmbed" +

    "?reportId=7647a9ef-ef89-45fa-9689-2d64e55c5637" +

    "&autoAuth=true" +

    "&ctid=1b635d23-d7cd-46f8-a33b-d081f11e0d7d" +

    "&navContentPaneEnabled=false" +

    "&filterPaneEnabled=false";



/* ============================================================
   PAGINAS VISIBLES

   SOLO ESTAS APARECEN EN EL MENU.

   IMPORTANTE:

   pageName DEBE SER EL ReportSection REAL.

   Ejemplo:

   ReportSection82ab2937d11779d
   
============================================================ */


const paginas = [


    {
        titulo:"Coppel PORTADA",
        pageName:"ReportSection_PORTADA",
        icono:"fa-house"
    },


    {
        titulo:"Coppel CONTENIDO",
        pageName:"ReportSection_CONTENIDO",
        icono:"fa-list"
    },


    {
        titulo:"Coppel SOI marca-medio",
        pageName:"ReportSection_SOI_MARCA_MEDIO",
        icono:"fa-chart-bar"
    },


    {
        titulo:"Coppel SOI marca-medio impresiones",
        pageName:"ReportSection_SOI_IMPRESIONES",
        icono:"fa-chart-column"
    },


    {
        titulo:"Coppel SOI por tipo de tiendas YTD",
        pageName:"ReportSection_TIPO_TIENDAS",
        icono:"fa-chart-pie"
    },


    {
        titulo:"Coppel Inversión por Medio",
        pageName:"ReportSection_INVERSION_MEDIO",
        icono:"fa-dollar-sign"
    },


    {
        titulo:"Coppel SOI por temporalidad YTD",
        pageName:"ReportSection_TEMPORALIDAD",
        icono:"fa-chart-line"
    },


    {
        titulo:"Coppel Actividad Tv Abierta Nacional",
        pageName:"ReportSection_TV_ABIERTA",
        icono:"fa-tv"
    },


    {
        titulo:"Coppel Tv abierta, SOV / SOI",
        pageName:"ReportSection_TV_SOV_SOI",
        icono:"fa-tv"
    },


    {
        titulo:"Coppel Tv abierta SOV / SOI mes actual",
        pageName:"ReportSection_TV_SOV_SOI_MES",
        icono:"fa-calendar"
    },


    {
        titulo:"Coppel Tv local",
        pageName:"ReportSection_TV_LOCAL",
        icono:"fa-location-dot"
    },


    {
        titulo:"Coppel Tv de Paga",
        pageName:"ReportSection_TV_PAGA",
        icono:"fa-satellite-dish"
    },


    {
        titulo:"Coppel Radio 49 Plazas",
        pageName:"ReportSection_RADIO_49",
        icono:"fa-radio"
    },


    {
        titulo:"Coppel Radio Footprint",
        pageName:"ReportSection_RADIO_FOOTPRINT",
        icono:"fa-tower-broadcast"
    },


    {
        titulo:"Coppel DIGITAL",
        pageName:"ReportSection_DIGITAL",
        icono:"fa-globe"
    }


];



/* ============================================================
   ELEMENTOS
============================================================ */


const iframe =
    document.getElementById("dashboardFrame");


const pagesContainer =
    document.getElementById("pages");


const loading =
    document.getElementById("loading");


const sidebar =
    document.getElementById("sidebar");


const collapseBtn =
    document.getElementById("collapseBtn");


const fullscreenBtn =
    document.getElementById("fullscreenBtn");


const reportArea =
    document.getElementById("reportArea");



/* ============================================================
   CREAR MENU
============================================================ */


function crearMenu(){


    pagesContainer.innerHTML = "";


    paginas.forEach(

        (pagina,index) => {


            const boton =
                document.createElement("button");


            boton.className =
                "page-btn";


            boton.title =
                pagina.titulo;


            boton.innerHTML = `

                <i class="fa-solid ${pagina.icono}"></i>

                <span class="page-text">

                    ${pagina.titulo}

                </span>

            `;


            boton.addEventListener(

                "click",

                function(){


                    cambiarPagina(

                        pagina,

                        boton

                    );


                }

            );


            pagesContainer.appendChild(
                boton
            );



            /* PRIMERA PAGINA */


            if(index === 0){


                boton.classList.add(
                    "active"
                );


            }


        }

    );


}



/* ============================================================
   CARGAR PRIMERA PAGINA
============================================================ */


function cargarReporteInicial(){


    if(paginas.length === 0){

        return;

    }


    const paginaInicial =
        paginas[0];


    loading.classList.remove(
        "hidden"
    );


    iframe.src =

        POWERBI_URL +

        "&pageName=" +

        encodeURIComponent(
            paginaInicial.pageName
        );


}



/* ============================================================
   CAMBIAR PAGINA
============================================================ */


function cambiarPagina(

    pagina,

    boton

){


    /* Si ya está seleccionada */

    if(
        boton.classList.contains("active")
    ){

        return;

    }



    /* Mostrar cargando */

    loading.classList.remove(
        "hidden"
    );



    /* Cambiar selección */

    document

        .querySelectorAll(".page-btn")

        .forEach(

            btn =>

            btn.classList.remove("active")

        );


    boton.classList.add(
        "active"
    );



    /* NUEVA URL */


    const nuevaURL =

        POWERBI_URL +

        "&pageName=" +

        encodeURIComponent(
            pagina.pageName
        );



    /* CAMBIAR POWER BI */


    iframe.src = nuevaURL;


}



/* ============================================================
   CUANDO EL IFRAME TERMINE DE CARGAR
============================================================ */


iframe.addEventListener(

    "load",

    function(){


        loading.classList.add(
            "hidden"
        );


    }

);



/* ============================================================
   CONTRAER MENU
============================================================ */


collapseBtn.addEventListener(

    "click",

    function(){


        sidebar.classList.toggle(
            "collapsed"
        );


        const icon =
            collapseBtn.querySelector("i");


        if(
            sidebar.classList.contains(
                "collapsed"
            )
        ){


            icon.className =
                "fa-solid fa-angles-right";


        }

        else{


            icon.className =
                "fa-solid fa-angles-left";


        }


    }

);



/* ============================================================
   PANTALLA COMPLETA
============================================================ */


fullscreenBtn.addEventListener(

    "click",

    async function(){


        try{


            if(
                !document.fullscreenElement
            ){


                await reportArea
                    .requestFullscreen();


            }

            else{


                await document
                    .exitFullscreen();


            }


        }

        catch(error){


            console.error(
                error
            );


        }


    }

);



/* ============================================================
   INICIO
============================================================ */


crearMenu();

cargarReporteInicial();


</script>


</body>
</html>
