<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Coppel | La Pícara Soñadora</title>

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
    }

    body {
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "SF Pro Display",
            "Segoe UI",
            Arial,
            sans-serif;

        overflow: hidden;

        background:
            linear-gradient(
                145deg,
                #003c73 0%,
                #005aa3 45%,
                #0077c8 100%
            );

        padding: 12px;
    }


    /* ======================================
       APP
    ====================================== */

    .app {
        width: 100%;
        height: 100%;

        display: flex;
        flex-direction: column;

        overflow: hidden;

        background: #f5f7fa;

        border-radius: 20px;

        box-shadow:
            0 20px 60px rgba(0, 24, 55, .25);
    }


    /* ======================================
       HEADER COMPACTO
    ====================================== */

    .topbar {
        height: 58px;
        min-height: 58px;

        padding: 0 22px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        background: #ffffff;

        border-bottom:
            1px solid rgba(17, 24, 39, .06);
    }


    /* IZQUIERDA */

    .brand {
        display: flex;
        align-items: center;

        gap: 16px;
    }


    .logo {
        width: 105px;
        height: 40px;

        display: flex;
        align-items: center;
        justify-content: center;
    }

    .logo img {
        max-width: 100%;
        max-height: 36px;

        object-fit: contain;
    }


    .divider {
        width: 1px;
        height: 28px;

        background: #e5e7eb;
    }


    .title h1 {
        font-size: 16px;

        font-weight: 650;

        color: #111827;

        line-height: 1.1;
    }


    .title p {
        margin-top: 3px;

        font-size: 10px;

        color: #8a94a3;
    }


    /* DERECHA */

    .badge {
        padding: 7px 13px;

        border-radius: 999px;

        background:
            rgba(255, 230, 0, .17);

        border:
            1px solid rgba(214, 190, 0, .25);

        color: #655b00;

        font-size: 10px;

        font-weight: 600;
    }


    /* ======================================
       CONTENIDO
    ====================================== */

    .main {
        flex: 1;

        min-width: 0;
        min-height: 0;

        padding: 8px;

        display: flex;
    }


    /* ======================================
       POWER BI
    ====================================== */

    .report {
        flex: 1;

        min-width: 0;
        min-height: 0;

        position: relative;

        overflow: hidden;

        background: #ffffff;

        border-radius: 14px;

        box-shadow:
            0 5px 20px rgba(18, 34, 58, .06);
    }


    .report::before {
        content: "";

        position: absolute;

        top: 0;
        left: 28px;

        width: 85px;
        height: 3px;

        background: #ffe600;

        border-radius: 0 0 5px 5px;

        z-index: 5;
    }


    .report iframe {
        position: absolute;

        inset: 0;

        width: 100%;
        height: 100%;

        border: 0;

        display: block;
    }


    /* ======================================
       RESPONSIVE
    ====================================== */

    @media(max-width: 700px) {

        body {
            padding: 5px;
        }

        .app {
            border-radius: 12px;
        }

        .topbar {
            height: 50px;
            min-height: 50px;

            padding: 0 12px;
        }

        .logo {
            width: 80px;
        }

        .divider,
        .title p,
        .badge {
            display: none;
        }

        .title h1 {
            font-size: 14px;
        }

        .main {
            padding: 5px;
        }

        .report {
            border-radius: 9px;
        }
    }

</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="topbar">

        <div class="brand">

            <div class="logo">
                <img
                    src="logo.jpg"
                    alt="Coppel">
            </div>

            <div class="divider"></div>

            <div class="title">

                <h1>
                    Actividad de Monitoreo
                </h1>

                <p>
                    La Pícara Soñadora · Coppel
                </p>

            </div>

        </div>


        <div class="badge">
            Coppel · 2026
        </div>

    </header>


    <!-- POWER BI -->

    <main class="main">

        <section class="report">

            <iframe
                title="LPS_ACTIVIDAD MONITOREO"

                src="https://app.powerbi.com/reportEmbed?reportId=293c36af-5d7a-4128-a5f4-0cbe77975aeb&autoAuth=true&ctid=1b635d23-d7cd-46f8-a33b-d081f11e0d7d&filterPaneEnabled=false&navContentPaneEnabled=false&actionBarEnabled=false"

                allowfullscreen="true">
            </iframe>

        </section>

    </main>

</div>

</body>
</html>
